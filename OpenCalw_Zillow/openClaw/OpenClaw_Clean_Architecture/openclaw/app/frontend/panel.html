<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw — Panel de Jobs y Telemetría</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    input, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    button { cursor: pointer; background: #0284c7; border-color: #0284c7; }
    button:hover { opacity: 0.9; }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    tr.job-row { cursor: pointer; }
    tr.job-row:hover { background: rgba(56, 189, 248, 0.08); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-queued { background: #334155; }
    .status-running { background: #0369a1; }
    .status-completed { background: #15803d; }
    .status-partial { background: #b45309; }
    .status-failed { background: #b91c1c; }
    pre {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow: auto;
      max-height: 260px;
      font-size: 0.8rem;
    }
    #telemetry-log {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.8rem;
    }
    #telemetry-log li { padding: 4px 0; border-bottom: 1px solid #1e293b; color: var(--muted); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>OpenClaw — Panel de Jobs y Telemetría (S5-04)</h1>
      <small id="ws-status" style="color: var(--muted);">Clave táctica gestionada por el servidor</small>
    </div>
    <div class="controls">
      <input id="query-input" type="text" placeholder="Ej: Cleveland, OH" value="Cleveland, OH" />
      <button id="btn-create-job" type="button">Iniciar barrido</button>
      <button id="btn-connect-ws" type="button">Conectar WS</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel" aria-label="Lista de jobs">
      <h2>Jobs recientes</h2>
      <div class="controls" style="margin-bottom: 10px;">
        <input id="lookup-job-id" type="text" placeholder="Consultar job_id (UUID)" style="flex:1;" />
        <button id="btn-lookup-job" type="button">Ver detalle</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Job ID</th>
            <th>Estado</th>
            <th>Consulta</th>
            <th>Plataformas</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
      </table>
    </section>

    <section class="panel" aria-label="Detalle del job seleccionado">
      <h2>Detalle del job</h2>
      <pre id="job-detail">Selecciona un job de la tabla o consulta un job_id para inspeccionar su detalle.</pre>

      <h2 style="margin-top: 16px;">Telemetría en vivo</h2>
      <ul id="telemetry-log"></ul>
    </section>
  </main>

  <script>
    const jobsMap = new Map();
    let wsConnection = null;
    const MAX_EVENTS = 100;

    function renderJobsTable() {
      const tbody = document.getElementById("jobs-tbody");
      tbody.replaceChildren();
      for (const job of jobsMap.values()) {
        const tr = document.createElement("tr");
        tr.className = "job-row";
        tr.title = "Haz clic para ver el detalle del job";
        tr.addEventListener("click", () => loadJobDetail(job.job_id));

        const tdId = document.createElement("td");
        tdId.textContent = job.job_id;

        const tdStatus = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = `badge status-${job.status}`;
        badge.textContent = job.status;
        tdStatus.appendChild(badge);

        const tdQuery = document.createElement("td");
        tdQuery.textContent = job.query;

        const tdPlatforms = document.createElement("td");
        tdPlatforms.textContent = (job.plataformas || []).join(", ");

        tr.append(tdId, tdStatus, tdQuery, tdPlatforms);
        tbody.appendChild(tr);
      }
    }

    async function loadJobDetail(jobId) {
      const detailEl = document.getElementById("job-detail");
      if (!jobId) {
        detailEl.textContent = "Escribe un job_id o crea un barrido para consultar su detalle.";
        return;
      }
      try {
        const resp = await fetch(`/panel/api/barridos/${encodeURIComponent(jobId)}`);
        const data = await resp.json().catch(() => ({ detail: "Respuesta no válida del servidor" }));
        if (!resp.ok) {
          detailEl.textContent = `Error ${resp.status}: ${JSON.stringify(data, null, 2)}`;
          return;
        }
        if (resp.ok && data.job_id) {
          jobsMap.set(data.job_id, data);
          document.getElementById("lookup-job-id").value = data.job_id;
          renderJobsTable();
        }
        detailEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        detailEl.textContent = `Error consultando job ${jobId}: ${err}`;
      }
    }

    async function createSweepJob() {
      const query = document.getElementById("query-input").value.trim();
      const resp = await fetch("/panel/api/barridos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, plataformas: ["zillow", "realtor", "redfin"] }),
      });
      const data = await resp.json();
      if (resp.ok && data.job_id) {
        jobsMap.set(data.job_id, data);
        document.getElementById("lookup-job-id").value = data.job_id;
        renderJobsTable();
        document.getElementById("job-detail").textContent = JSON.stringify(data, null, 2);
      } else {
        document.getElementById("job-detail").textContent = JSON.stringify(data, null, 2);
      }
    }

    function appendTelemetry(line) {
      const list = document.getElementById("telemetry-log");
      const li = document.createElement("li");
      li.textContent = `[${new Date().toISOString()}] ${line}`;
      list.prepend(li);
      while (list.children.length > MAX_EVENTS) {
        list.removeChild(list.lastChild);
      }
    }

    function connectTelemetryWs() {
      const statusEl = document.getElementById("ws-status");
      if (wsConnection) wsConnection.close();
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      wsConnection = new WebSocket(`${proto}//${window.location.host}/v1/openclaw/ws/scraping-feed`);
      wsConnection.onopen = () => {
        statusEl.textContent = "Telemetría WS: conectado";
        appendTelemetry("Conectado al feed de telemetría.");
      };
      wsConnection.onmessage = (ev) => appendTelemetry(ev.data);
      wsConnection.onclose = () => {
        statusEl.textContent = "Telemetría WS: desconectado";
      };
    }

    document.getElementById("btn-create-job").addEventListener("click", createSweepJob);
    document.getElementById("btn-lookup-job").addEventListener("click", () => {
      const id = document.getElementById("lookup-job-id").value.trim();
      loadJobDetail(id);
    });
    document.getElementById("btn-connect-ws").addEventListener("click", connectTelemetryWs);
  </script>
</body>
</html>
